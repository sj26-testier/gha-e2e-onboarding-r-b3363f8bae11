name: Windows current image and cache discovery
on:
  push:
    branches: [lab/r-b3363f8bae11]
permissions: {}
jobs:
  probe:
    name: Windows image and cache discovery
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Collect runtime-visible inventory
        shell: powershell
        run: ./.lab/inventory/collect.ps1 -Phase runtime
      - name: Observe baseline and create payload
        id: seed
        run: ./.lab/inventory/probe.ps1 -Phase baseline
      - name: Save baseline archive
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lab-cache-probe
          key: lab-win-b3363f8bae11-baseline
          enableCrossOsArchive: true
      - name: Remove payload before baseline restore
        run: Remove-Item -LiteralPath '.lab-cache-probe' -Recurse -Force
      - name: Restore baseline archive
        id: baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lab-cache-probe
          key: lab-win-b3363f8bae11-baseline
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify baseline bytes and exact hit
        env:
          CACHE_HIT: ${{ steps.baseline.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.baseline.outputs.cache-matched-key }}
          EXPECTED_SHA256: ${{ steps.seed.outputs.sha256 }}
        run: |
          if ($env:CACHE_HIT -cne 'true' -or $env:MATCHED_KEY -cne 'lab-win-b3363f8bae11-baseline') { throw 'Not exact baseline cache hit' }
          if ((Get-FileHash '.lab-cache-probe/payload.txt' -Algorithm SHA256).Hash -cne $env:EXPECTED_SHA256) { throw 'Baseline restored bytes differ' }
          Write-Output 'PASS_BASELINE_EXACT_HIT_AND_SHA256'
      - name: Bridge installed tools in this disposable job only
        run: ./.lab/inventory/probe.ps1 -Phase bridge
      - name: Save archive after trusted-location bridge
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lab-cache-probe
          key: lab-win-b3363f8bae11-bridged
          enableCrossOsArchive: true
      - name: Remove payload before bridged restore
        run: Remove-Item -LiteralPath '.lab-cache-probe' -Recurse -Force
      - name: Restore archive after trusted-location bridge
        id: bridged
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lab-cache-probe
          key: lab-win-b3363f8bae11-bridged
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify bridged bytes and exact hit
        env:
          CACHE_HIT: ${{ steps.bridged.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.bridged.outputs.cache-matched-key }}
          EXPECTED_SHA256: ${{ steps.seed.outputs.sha256 }}
        run: |
          if ($env:CACHE_HIT -cne 'true' -or $env:MATCHED_KEY -cne 'lab-win-b3363f8bae11-bridged') { throw 'Not exact bridged cache hit' }
          if ((Get-FileHash '.lab-cache-probe/payload.txt' -Algorithm SHA256).Hash -cne $env:EXPECTED_SHA256) { throw 'Bridged restored bytes differ' }
          Write-Output 'PASS_BRIDGED_EXACT_HIT_AND_SHA256'
          ./.lab/inventory/probe.ps1 -Phase final
